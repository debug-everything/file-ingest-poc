[project]
name = "mft-client"
version = "0.1.0"
description = "MFT client for the streaming pass-through POC"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "python-ulid>=3.0", "rich>=13.9"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mft"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S603", "S607"]  # curl mode shells out on purpose

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
